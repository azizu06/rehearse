name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate required foundation
        run: |
          test -f AGENTS.md
          test -f CONTEXT.md
          test -f PRD.md
          test -f LICENSE
          test -f docs/agents/review-policy.md

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go module
        id: module
        run: |
          if test -f go.mod; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        if: steps.module.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.module.outputs.present == 'true'
        run: go test ./...
      - if: steps.module.outputs.present == 'true'
        run: go test -race ./...
      - if: steps.module.outputs.present == 'true'
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect web application
        id: app
        run: |
          if test -f web/package.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.app.outputs.present == 'true'
        working-directory: web
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        working-directory: web
        run: npm run lint
      - if: steps.app.outputs.present == 'true'
        working-directory: web
        run: npm run test -- --run
      - if: steps.app.outputs.present == 'true'
        working-directory: web
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Terraform configuration
        id: config
        run: |
          if find deploy/terraform -name '*.tf' -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@v4
        if: steps.config.outputs.present == 'true'
      - if: steps.config.outputs.present == 'true'
        run: terraform fmt -check -recursive deploy/terraform
