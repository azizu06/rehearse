name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate required foundation
        run: |
          test -f AGENTS.md
          test -f CONTEXT.md
          test -f PRD.md
          test -f LICENSE
          test -f docs/agents/review-policy.md

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make test
      - run: make test-race
      - run: make lint
      - run: make build

  browser-smoke:
    name: Browser smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - if: runner.os == 'Linux'
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: npm --prefix web exec -- playwright install chromium
      - run: make test-browser

  probe-integration:
    name: Probe integration (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make test-integration

  docker-sandbox-integration:
    name: Docker sandbox integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: docker version
      - run: docker compose version
      - run: docker pull alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      - run: go test -race -p=2 -parallel=2 ./internal/sandbox -count=1
        env:
          REHEARSE_DOCKER_INTEGRATION: "1"

  adapter-integration:
    name: Restic adapter integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install verified restic 0.19.1
        run: |
          curl --fail --silent --show-error --location --remote-name https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          curl --fail --silent --show-error --location --remote-name https://github.com/restic/restic/releases/download/v0.19.1/SHA256SUMS
          grep ' restic_0.19.1_linux_amd64.bz2$' SHA256SUMS | sha256sum --check --strict -
          bunzip2 restic_0.19.1_linux_amd64.bz2
          install -m 0755 restic_0.19.1_linux_amd64 "$RUNNER_TEMP/restic"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make test-adapters-race
      - name: Fuzz hostile restic JSON boundaries
        run: |
          go test ./internal/source/restic -run '^$' -fuzz '^FuzzDecodeVersionMessage$' -fuzztime=5s -parallel=4
          go test ./internal/source/restic -run '^$' -fuzz '^FuzzDecodeResticMessageType$' -fuzztime=5s -parallel=4
          go test ./internal/source/restic -run '^$' -fuzz '^FuzzDecodeRestoreSummary$' -fuzztime=5s -parallel=4
          go test ./internal/source/restic -run '^$' -fuzz '^FuzzValidateStructuredExit$' -fuzztime=5s -parallel=4
      - name: Surface restic fuzz failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restic-fuzz-failures
          path: internal/source/restic/testdata/fuzz
          if-no-files-found: ignore

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
          skip-dirs: .git,build,web/node_modules

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Terraform configuration
        id: config
        run: |
          if find deploy/terraform -name '*.tf' -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@v4
        if: steps.config.outputs.present == 'true'
      - if: steps.config.outputs.present == 'true'
        run: terraform fmt -check -recursive deploy/terraform
